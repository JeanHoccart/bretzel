name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # The default suite deselects browser tests, but pytest still imports
        # their modules during collection; the Playwright Python API is needed.
        run: python -m pip install -e ".[dev,probe]"
      - name: Test
        run: python -m pytest

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke test installed package
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import bretzel; print(bretzel.__version__)"
          bretzel describe button
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
